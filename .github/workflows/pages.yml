name: Publish website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/configure-pages@v5
        id: pages
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build the local-first studio and documentation
        env:
          VITE_DOCS_URL: ${{ steps.pages.outputs.base_path }}/docs/
          VITE_API_URL: ""
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}/docs/
        run: |
          pnpm --filter @random-api/core build
          pnpm --filter @random-api/web build
          pnpm --filter @random-api/docs build
          cp -R apps/docs/.vitepress/dist apps/web/dist/docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
