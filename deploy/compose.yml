services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      API_MODE: public
      API_KEY_FILE: /run/secrets/api_key
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080/api/}
    user: "${RUNTIME_UID:-1000}:${RUNTIME_GID:-1000}"
    secrets:
      - api_key
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
  api-nginx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    user: "${RUNTIME_UID:-1000}:${RUNTIME_GID:-1000}"
    depends_on:
      api-nginx:
        condition: service_healthy
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    networks:
      - frontend
      - backend
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
networks:
  frontend:
  backend:
    internal: true
secrets:
  api_key:
    file: ${API_KEY_FILE:?Set API_KEY_FILE to a key file outside the repository}
