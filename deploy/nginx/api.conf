worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/http-common.conf;
    upstream api_backend {
        zone api_backend 64k;
        server api:3000 resolve;
    }
    # This service has no published ports; only private Docker peers can connect.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    limit_req_zone $binary_remote_addr zone=clients:10m rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=connections:10m;
    server {
        listen 8080;
        limit_req zone=clients burst=10 nodelay;
        limit_req_status 429;
        limit_req_log_level notice;
        limit_conn connections 4;
        limit_conn_status 429;
        error_page 429 = @limited;
        error_page 413 = @too_large;
        error_page 502 503 504 = @unavailable;
        location @limited {
            default_type application/json;
            add_header Retry-After 2 always;
            add_header Cache-Control no-store always;
            return 429 '{"error":"API request limit reached."}';
        }
        location @too_large {
            default_type application/json;
            return 413 '{"error":"Request body too large."}';
        }
        location @unavailable {
            default_type application/json;
            return 503 '{"error":"API temporarily unavailable."}';
        }
        location / {
            proxy_pass http://api_backend;
            proxy_set_header Host $http_host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header Connection "";
        }
    }
}
