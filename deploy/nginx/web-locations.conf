root /usr/share/nginx/html;
index index.html;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
location = /health { default_type text/plain; return 200 "ok\n"; }
location = /api { return 308 /api/; }
location /api/ {
    error_page 413 = @api_too_large;
    error_page 502 503 504 = @api_unavailable;
    proxy_pass http://api_gateway/;
    proxy_set_header Host $http_host;
    # Discard caller-supplied forwarding headers before the private gateway.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
}
location @api_too_large {
    default_type application/json;
    return 413 '{"error":"Request body too large."}';
}
location @api_unavailable {
    default_type application/json;
    return 503 '{"error":"API temporarily unavailable."}';
}
location = /docs { return 308 /docs/; }
location /docs/ { try_files $uri $uri.html $uri/ =404; }
location / { try_files $uri $uri/ =404; }
