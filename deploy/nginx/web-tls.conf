worker_processes 2;
pid /tmp/nginx.pid;
error_log stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/http-common.conf;
    upstream api_gateway {
        zone api_gateway 64k;
        server api-nginx:8080 resolve;
    }
    server {
        listen 8080;
        location = /health { default_type text/plain; return 200 "ok\n"; }
        location / { return 308 https://$host$request_uri; }
    }
    server {
        listen 8443 ssl;
        ssl_certificate /run/secrets/tls_certificate;
        ssl_certificate_key /run/secrets/tls_private_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:1m;
        add_header Strict-Transport-Security "max-age=31536000" always;
        include /etc/nginx/web-locations.conf;
    }
}
